# Local stand-ins for the Azure services:
#   sqlserver -> Azure SQL | mongo -> Azure DocumentDB | redis -> Azure Managed Redis | rabbitmq -> RabbitMQ in AKS (or Service Bus)
#   azurite -> Azure Storage (blobs)
#
#   docker compose up --build
#   Web app:      http://localhost:3080
#   Swagger:      http://localhost:5080/swagger
#   RabbitMQ UI:  http://localhost:15673  (guest / guest)

x-dotnet-env: &dotnet-env
  ConnectionStrings__Sql: "Server=sqlserver,1433;Database=QuickCover;User Id=sa;Password=${SA_PASSWORD:-QuickCover_Dev123!};TrustServerCertificate=True"
  Messaging__Transport: RabbitMq
  Messaging__RabbitMq__Host: rabbitmq
  # appsettings.json holds the HOST-side port (5673) for running outside Docker; inside the network it's 5672.
  Messaging__RabbitMq__Port: "5672"

# Azurite's published, well-known development key. Not a secret; only works against the emulator.
x-blob-conn: &blob-conn "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-QuickCover_Dev123!}"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["${RABBITMQ_PORT:-5673}:5672", "${RABBITMQ_UI_PORT:-15673}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # Blob service only. --skipApiVersionCheck lets newer Azure SDKs talk to the emulator.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--location", "/data"]
    ports: ["${AZURITE_PORT:-10000}:10000"]
    volumes: ["azurite-data:/data"]

  quote-api:
    build:
      context: .
      dockerfile: src/QuickCover.QuoteApi/Dockerfile
    environment:
      <<: *dotnet-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Mongo: "mongodb://mongo:27017"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__Blob: *blob-conn
    ports: ["5080:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      azurite: { condition: service_started }

  policy-worker:
    build:
      context: .
      dockerfile: src/QuickCover.PolicyWorker/Dockerfile
    environment:
      <<: *dotnet-env
      DOTNET_ENVIRONMENT: Development
    restart: unless-stopped
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  docs-worker:
    build:
      context: .
      dockerfile: src/QuickCover.DocsWorker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Messaging__Transport: RabbitMq
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__Port: "5672"
      ConnectionStrings__Blob: *blob-conn
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }
      azurite: { condition: service_started }

  web:
    build:
      context: src/QuickCover.Web
    environment:
      # Server-side only: the browser calls the web app, which proxies /api/* to this address.
      API_URL: "http://quote-api:8080"
    ports: ["${WEB_PORT:-3080}:3000"]
    depends_on:
      - quote-api

volumes:
  azurite-data:
